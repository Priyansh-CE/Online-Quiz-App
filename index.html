<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultimate Quiz App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);transition:0.3s;}
body.dark{background:linear-gradient(135deg,#1a202c,#2d3748)}
.container{background:#fff;width:90%;max-width:520px;padding:25px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.2);text-align:center;transition:0.3s;}
body.dark .container{background:#2d3748;color:#fff}
.toggle{text-align:right;font-size:14px;cursor:pointer;margin-bottom:10px}
#timer{color:#e53e3e;font-weight:bold}
#count{font-size:14px;margin:8px 0}
.progress{height:8px;background:#e2e8f0;border-radius:10px;margin-bottom:15px;overflow:hidden;}
.progress-bar{height:100%;width:0%;background:#667eea;transition:width 0.4s;}
body.dark .progress{background:#4a5568}
#question{font-size:18px;margin-bottom:15px}
.options{display:flex;flex-direction:column;gap:10px}
button{padding:12px;border:none;border-radius:8px;background:#667eea;color:white;font-size:16px;cursor:pointer;transition:0.3s}
button:hover{opacity:0.9}
.correct{background:#48bb78!important}
.wrong{background:#e53e3e!important}
#nextBtn,#restartBtn{margin-top:15px;display:none}
.result{display:none;text-align:left;}
.pass{color:#38a169}
.fail{color:#e53e3e}
#highScore{margin-top:10px;font-size:14px;color:#fff;text-align:right}
body.dark #highScore{color:#fbd38d}
#categorySelect{margin-bottom:15px;padding:10px;width:60%;border-radius:8px;border:1px solid #ddd;}
.badge{display:inline-block;background:#f6ad55;color:#fff;padding:4px 8px;margin:4px;border-radius:6px;font-size:12px;}
.review-answer{margin-bottom:8px;}
</style>
</head>
<body>

<div class="container">
  <div class="toggle" onclick="toggleMode()">🌙 Dark Mode</div>
  <h1>Ultimate Quiz App</h1>

  <select id="categorySelect">
    <option value="">Select Category</option>
    <option value="GK">General Knowledge</option>
    <option value="Sports">Sports</option>
    <option value="Movies">Movies</option>
    <option value="Science">Science</option>
    <option value="History">History</option>
    <option value="Technology">Technology</option>
    <option value="Random">Random</option>
  </select>

  <button onclick="startCategory()">Start Quiz</button>

  <div id="quizBox" style="display:none">
    <div id="count"></div>
    <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
    <div id="timer">Time: 10s</div>
    <div id="question"></div>

    <div class="options">
      <button class="option"></button>
      <button class="option"></button>
      <button class="option"></button>
      <button class="option"></button>
    </div>

    <button id="nextBtn">Next</button>
    <div id="highScore"></div>
  </div>

  <div id="resultBox" class="result">
    <h2 id="resultText"></h2>
    <p id="scoreText"></p>
    <p id="highScoreResult"></p>
    <div id="badges"></div>
    <h4>Review Answers:</h4>
    <div id="review"></div>
    <button id="restartBtn">Restart</button>
  </div>
</div>

<audio id="correctSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
<audio id="wrongSound" src="https://actions.google.com/sounds/v1/cartoon/boing.ogg"></audio>

<script>
let allQuestions = [
  // ===== GK 20 =====

  {q:"Which planet is known as the Red Planet?", o:["Earth","Mars","Jupiter","Venus"], a:1, cat:"GK"},
  {q:"Who wrote 'Romeo and Juliet'?", o:["Shakespeare","Dickens","Hemingway","Tolkien"], a:0, cat:"GK"},
  {q:"Which is the largest ocean on Earth?", o:["Atlantic","Indian","Arctic","Pacific"], a:3, cat:"GK"},
  {q:"What is the chemical symbol for water?", o:["O2","H2O","CO2","NaCl"], a:1, cat:"GK"},
  {q:"Who is known as the father of Computers?", o:["Charles Babbage","Alan Turing","Tim Berners-Lee","Steve Jobs"], a:0, cat:"GK"},
  {q:"Which country gifted the Statue of Liberty to the USA?", o:["France","UK","Germany","Italy"], a:0, cat:"GK"},
  {q:"What is the smallest prime number?", o:["1","2","3","0"], a:1, cat:"GK"},
  {q:"Which is the fastest land animal?", o:["Lion","Cheetah","Horse","Tiger"], a:1, cat:"GK"},
  {q:"What is the largest mammal?", o:["Elephant","Blue Whale","Giraffe","Hippo"], a:1, cat:"GK"},
  {q:"Which element has the atomic number 1?", o:["Helium","Hydrogen","Oxygen","Carbon"], a:1, cat:"GK"},
  {q:"Who discovered penicillin?", o:["Marie Curie","Alexander Fleming","Louis Pasteur","Isaac Newton"], a:1, cat:"GK"},
  {q:"Which continent is the Sahara Desert in?", o:["Asia","Africa","Australia","Europe"], a:1, cat:"GK"},
  {q:"Which is the largest country by area?", o:["USA","Russia","China","Canada"], a:1, cat:"GK"},
  {q:"Who painted the Mona Lisa?", o:["Van Gogh","Picasso","Da Vinci","Rembrandt"], a:2, cat:"GK"},
  {q:"Which gas do plants absorb from the atmosphere?", o:["Oxygen","Carbon Dioxide","Nitrogen","Hydrogen"], a:1, cat:"GK"},
  {q:"What is the hardest natural substance?", o:["Gold","Iron","Diamond","Quartz"], a:2, cat:"GK"},
  {q:"Which is the smallest continent?", o:["Australia","Europe","Antarctica","South America"], a:0, cat:"GK"},
  {q:"Which planet is closest to the sun?", o:["Mercury","Venus","Earth","Mars"], a:0, cat:"GK"},
  {q:"What is the boiling point of water in Celsius?", o:["90","80","100","120"], a:2, cat:"GK"},

  // ===== Sports 20 =====
  {q:"Which sport uses a shuttlecock?", o:["Badminton","Tennis","Cricket","Squash"], a:0, cat:"Sports"},
  {q:"How many players are there in a football team?", o:["11","9","7","12"], a:0, cat:"Sports"},
  {q:"Which country won the 2018 FIFA World Cup?", o:["Germany","Brazil","France","Argentina"], a:2, cat:"Sports"},
  {q:"What is the national sport of Japan?", o:["Sumo Wrestling","Karate","Baseball","Judo"], a:0, cat:"Sports"},
  {q:"Which sport is known as 'the king of sports'?", o:["Football","Cricket","Basketball","Tennis"], a:0, cat:"Sports"},
  {q:"Which player is called 'The King of Cricket'?", o:["Sachin Tendulkar","Virat Kohli","MS Dhoni","Brian Lara"], a:0, cat:"Sports"},
  {q:"How many minutes are there in a standard basketball game?", o:["40","48","60","50"], a:1, cat:"Sports"},
  {q:"Which country hosted the 2016 Olympics?", o:["China","UK","Brazil","Japan"], a:2, cat:"Sports"},
  {q:"Which country has won the most Cricket World Cups?", o:["Australia","India","West Indies","England"], a:0, cat:"Sports"},
  {q:"Which tennis tournament is played on clay courts?", o:["Wimbledon","French Open","US Open","Australian Open"], a:1, cat:"Sports"},
  {q:"In which sport is the term 'hat-trick' used?", o:["Football","Cricket","Hockey","All of the above"], a:3, cat:"Sports"},
  {q:"Which country is famous for Formula 1 racing?", o:["Italy","Germany","UK","All of the above"], a:3, cat:"Sports"},
  {q:"Which game uses a puck?", o:["Hockey","Soccer","Basketball","Lacrosse"], a:0, cat:"Sports"},
  {q:"Which country won the first Cricket World Cup?", o:["West Indies","Australia","India","England"], a:0, cat:"Sports"},
  {q:"Which is the national sport of Canada?", o:["Ice Hockey","Lacrosse","Basketball","Baseball"], a:1, cat:"Sports"},
  {q:"Who holds the record for most Olympic gold medals?", o:["Michael Phelps","Usain Bolt","Carl Lewis","Mark Spitz"], a:0, cat:"Sports"},
  {q:"Which sport is known as 'The Gentleman's Game'?", o:["Cricket","Football","Tennis","Golf"], a:0, cat:"Sports"},
  {q:"Which country invented table tennis?", o:["USA","China","UK","Germany"], a:2, cat:"Sports"},
  {q:"Which sport uses a bow and arrow?", o:["Archery","Fencing","Shooting","Darts"], a:0, cat:"Sports"},
  {q:"Which country hosted the 2014 FIFA World Cup?", o:["Brazil","Germany","South Africa","Russia"], a:0, cat:"Sports"},

  // ===== Movies 20 =====
  {q:"Who directed 'Titanic'?", o:["James Cameron","Steven Spielberg","Christopher Nolan","Martin Scorsese"], a:0, cat:"Movies"},
  {q:"Which movie features the song 'Let It Go'?", o:["Frozen","Moana","Tangled","Brave"], a:0, cat:"Movies"},
  {q:"Who played Iron Man?", o:["Chris Hemsworth","Robert Downey Jr.","Chris Evans","Mark Ruffalo"], a:1, cat:"Movies"},
  {q:"Which movie won Best Picture at Oscars 2020?", o:["1917","Joker","Parasite","Once Upon a Time"], a:2, cat:"Movies"},
  {q:"Who played Jack Sparrow?", o:["Johnny Depp","Orlando Bloom","Tom Cruise","Leonardo DiCaprio"], a:0, cat:"Movies"},
  {q:"Which movie is part of the Marvel Cinematic Universe?", o:["Inception","Avengers","Interstellar","The Matrix"], a:1, cat:"Movies"},
  {q:"Who voiced Simba in 'The Lion King' 2019?", o:["Donald Glover","James Earl Jones","Matthew Broderick","Chiwetel Ejiofor"], a:0, cat:"Movies"},
  {q:"Which actress starred in 'Wonder Woman'?", o:["Gal Gadot","Scarlett Johansson","Jennifer Lawrence","Emma Stone"], a:0, cat:"Movies"},
  {q:"What is the highest-grossing film of all time?", o:["Avatar","Titanic","Avengers: Endgame","Star Wars"], a:2, cat:"Movies"},
  {q:"Who directed 'Inception'?", o:["Christopher Nolan","Quentin Tarantino","James Cameron","Peter Jackson"], a:0, cat:"Movies"},
  {q:"Which film features 'I am your father'?", o:["Star Wars","Star Trek","Guardians of the Galaxy","The Matrix"], a:0, cat:"Movies"},
  {q:"Which actor plays Spider-Man in MCU?", o:["Tom Holland","Andrew Garfield","Tobey Maguire","Jake Gyllenhaal"], a:0, cat:"Movies"},
  {q:"Which movie won the first Academy Award for Best Picture?", o:["Wings","The Jazz Singer","Sunrise","Ben-Hur"], a:0, cat:"Movies"},
  {q:"Which movie features the DeLorean time machine?", o:["Back to the Future","Terminator","Interstellar","Ready Player One"], a:0, cat:"Movies"},
  {q:"Who voiced Woody in 'Toy Story'?", o:["Tom Hanks","Tim Allen","Robin Williams","Billy Crystal"], a:0, cat:"Movies"},
  {q:"Which movie is known for the line 'Here's looking at you, kid'?", o:["Casablanca","Gone with the Wind","Citizen Kane","The Godfather"], a:0, cat:"Movies"},
  {q:"Who directed 'Avatar'?", o:["James Cameron","Steven Spielberg","Peter Jackson","Ridley Scott"], a:0, cat:"Movies"},
  {q:"Which film is about a ship sinking in the Atlantic Ocean?", o:["Titanic","Poseidon","The Perfect Storm","Life of Pi"], a:0, cat:"Movies"},
  {q:"Which actor played Joker in 2019 movie?", o:["Joaquin Phoenix","Heath Ledger","Jack Nicholson","Jared Leto"], a:0, cat:"Movies"},
  {q:"Which movie franchise features Hogwarts?", o:["Harry Potter","Percy Jackson","Twilight","Lord of the Rings"], a:0, cat:"Movies"}
  // ===== Add Science, History, Technology, Random similarly =====
];

// -------- Quiz Logic --------
let i=0, score=0, time=10, timer, reviewData=[];
const q=document.getElementById("question");
const opts=document.querySelectorAll(".option");
const next=document.getElementById("nextBtn");
const restart=document.getElementById("restartBtn");
const timerEl=document.getElementById("timer");
const count=document.getElementById("count");
const bar=document.getElementById("progressBar");
const quizBox=document.getElementById("quizBox");
const resultBox=document.getElementById("resultBox");
const resultText=document.getElementById("resultText");
const scoreText=document.getElementById("scoreText");
const highScoreDiv=document.getElementById("highScore");
const highScoreResult=document.getElementById("highScoreResult");
const categorySelect=document.getElementById("categorySelect");
const badgesDiv=document.getElementById("badges");
const reviewDiv=document.getElementById("review");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");

let highScore=JSON.parse(localStorage.getItem("quizHighScore")) || {};
highScoreDiv.innerText="High Score: "+(highScore[categorySelect.value]||0);

function startCategory(){
 let cat=categorySelect.value;
 if(!cat) return alert("Select a category!");
 questions=allQuestions.filter(q=>q.cat===cat);
 questions.sort(()=>Math.random()-0.5);
 document.querySelector("button[onclick='startCategory()']").style.display="none";
 categorySelect.style.display="none";
 quizBox.style.display="block";
 reviewData=[];
 i=0; score=0;
 load();
 updateHighScore();
}

function load(){
 reset();
 startTimer();
 count.innerText=`Question ${i+1} of ${questions.length}`;
 bar.style.width=`${((i+1)/questions.length)*100}%`;

 let options=[...questions[i].o];
 let correct=options[questions[i].a];
 options.sort(()=>Math.random()-0.5);

 q.innerText=questions[i].q;
	opts.forEach((b,idx)=>{
	  b.innerText=options[idx];
	  b.onclick=()=>check(options[idx],correct,b);
	});
}

function check(selected,correct,btn){
 stopTimer();
	opts.forEach(b=>b.disabled=true);
	if(selected===correct){
	  btn.classList.add("correct");
	  score++;
	  correctSound.play();
	}else{
	  btn.classList.add("wrong");
	  opts.forEach(b=>{if(b.innerText===correct)b.classList.add("correct")});
	  wrongSound.play();
	}
	reviewData.push({question:questions[i].q,selected,correct});
	next.style.display="block";
}

function startTimer(){
	time=10;
	timerEl.innerText=`Time: ${time}s`;
	timer=setInterval(()=>{
		time--;
		timerEl.innerText=`Time: ${time}s`;
		if(time===0){stopTimer(); autoFail();}
	},1000);
}

function stopTimer(){clearInterval(timer);}

function autoFail(){
	opts.forEach(b=>b.disabled=true);
	opts.forEach(b=>{if(b.innerText===questions[i].o[questions[i].a])b.classList.add("correct");});
	reviewData.push({question:questions[i].q,selected:"No Answer",correct:questions[i].o[questions[i].a]});
	next.style.display="block";
}

function reset(){next.style.display="none"; opts.forEach(b=>{b.disabled=false;b.className="option";});}

next.onclick=()=>{
	i++;
	if(i<questions.length) load();
	else showResult();
};

function showResult(){
	quizBox.style.display="none";
	resultBox.style.display="block";
	let percent=Math.round((score/questions.length)*100);
	scoreText.innerText=`Score: ${score}/${questions.length} (${percent}%)`;
	resultText.innerText=percent>=50?"🎉 PASS":"❌ FAIL";
	resultText.className=percent>=50?"pass":"fail";

	let cat=categorySelect.value
