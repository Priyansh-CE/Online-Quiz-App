<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Quiz App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="quiz-box">
    <h2>Online Quiz App</h2>

    <!-- Question -->
    <div id="question">
      Question will appear here
    </div>

    <!-- Options -->
    <div class="options">
      <button class="option">Option 1</button>
      <button class="option">Option 2</button>
      <button class="option">Option 3</button>
      <button class="option">Option 4</button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span id="progress">Question 1 of 5</span>
      <button id="nextBtn">Next</button>
    </div>
  </div>

</body>
</html>
